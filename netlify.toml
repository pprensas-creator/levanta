[build]
  publish = "."
  # Seguridad: el despliegue falla si queda algún dato legal sin completar
  command = "! grep -q '{{DOMICILIO}}' aviso-legal.html politica-privacidad.html"
  functions = "netlify/functions"

[functions."weekly-newsletter"]
  schedule = "0 7 * * 1"

# Cabeceras de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Política de seguridad de contenido (aplicada). Probada sin avisos en navegador real (Chromium).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://stats.g.doubleclick.net; connect-src 'self' https://formspree.io https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io"
